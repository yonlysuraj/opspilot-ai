[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.3,<2",
    "filelock>=3.19,<4",
    "fastapi>=0.165,<1",
    "httpx>=0.28,<1",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0.1,<5",
    "mcp>=2.3,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pypdf>=6,<8",
    "python-multipart>=0.0.22,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
