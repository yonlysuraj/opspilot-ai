server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 5m;
    access_log off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://ollama:8000;
        proxy_read_timeout 700s;
    }

    location /health/ {
        proxy_pass http://ollama:8000;
    }
}
